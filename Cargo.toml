[package]
name = "aleph_core"
version = "0.1.0"
edition = "2021"
authors = ["Shem <shem-aleph@proton.me>"]
description = "Rust implementation of the Aleph.im Core Node"
repository = "https://github.com/shem-aleph/pyaleph-rs"
license = "MIT"

[dependencies]
# Official Aleph types (use git until published to crates.io)
# aleph-types = { git = "https://github.com/aleph-im/aleph-rs", branch = "main" }
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal"] }

# Crypto
secp256k1 = { version = "0.28", features = ["recovery"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
ripemd = "0.1"
bech32 = "0.11"

# HTTP client
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
uuid = { version = "1.7", features = ["v4", "serde"] }
rust_decimal = { version = "1.34", features = ["serde"] }
rust_decimal_macros = "1.34"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
clap = { version = "4.5", features = ["derive"] }

# IPFS
ipfs-api-backend-hyper = "0.6"

# Message Queue (for p2p-service integration)
lapin = "2.3"

# Redis client (for peer discovery / api_servers)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# LRU cache (for message deduplication)
lru = "0.12"

# URL decoding (p2p messages are URL-encoded)
urlencoding = "2.1"

# Random selection (peer picking)
rand = "0.8"

# Blockchain specific
ethers = "2.0"
url = "2.5.8"
# web3 = "0.19"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"

[[bin]]
name = "aleph-core"
path = "src/main.rs"

[lib]
name = "aleph_core"
path = "src/lib.rs"
