# Aleph Core Node Configuration

[node]
# Unique node identifier (generated if not set)
# id = "my-node-id"
name = "aleph-core"
data_dir = "./data"
log_level = "info"  # trace, debug, info, warn, error

[database]
url = "postgres://localhost/aleph"
max_connections = 10
connect_timeout = 30  # seconds

[storage]
files_dir = "./data/files"
cache_dir = "./data/cache"
max_file_size = 104857600  # 100MB
enable_cache = true

[api]
host = "0.0.0.0"
port = 8080
cors_enabled = true
cors_origins = ["*"]
rate_limit = 100  # requests per second

[chains.ethereum]
enabled = true
rpc_url = "https://eth-mainnet.g.alchemy.com/v2/YOUR_KEY"
contract_address = "0x27B98C76b96f7e6DD2cF4eE25AceB3c1B4412e59"
chain_id = 1
start_block = 10000000

# [chains.solana]
# enabled = false
# rpc_url = "https://api.mainnet-beta.solana.com"
# program_id = "..."

# [chains.tezos]
# enabled = false
# rpc_url = "https://mainnet.api.tez.ie"
# contract_address = "..."

[p2p]
enabled = true
listen_addrs = ["/ip4/0.0.0.0/tcp/4025"]
bootstrap_peers = [
  "/dns/api2.aleph.im/tcp/4025/p2p/QmZkurbY2G2hWay59yiTgQNaQxHSNzKZFt2jbnwJhQcKgV",
  "/dns/api3.aleph.im/tcp/4025/p2p/Qmb5b2ZwJm9pVWrppf3D3iMF1bXbjZhbJTwGvKEBMZNxa2",
]
topic = "ALEPH-TEST"

[ipfs]
api_url = "http://ipfs:5001"
gateway_url = "https://ipfs.io/ipfs"
pin_content = true

[rabbitmq]
url = "amqp://aleph-p2p:change-me!@rabbitmq:5672"
pub_exchange = "p2p-publish"
sub_exchange = "p2p-subscribe"
enabled = true
prefetch_count = 100

[redis]
url = "redis://redis:6379"
enabled = true
pool_size = 10
default_ttl = 300
key_prefix = "aleph:"
